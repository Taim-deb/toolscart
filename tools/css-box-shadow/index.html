<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Shadow Generator - ToolScart</title>
  <link rel="icon" href="/IMG_9203.JPG.ico" type="image/x-icon">
  <meta name="description" content="CSS Box Shadow Generator - Build box-shadow CSS values.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar wrap">
    <a class="brand" href="/">ToolScart</a>
    <nav><a href="https://github.com/taim-deb/toolscart">GitHub</a></nav>
  </header>

  <main class="wrap page tool">
    <div class="crumb"><a href="/">Back to Tools</a><span>ToolScart</span></div>
    <h1>CSS Box Shadow Generator</h1>
    <p>Build box-shadow CSS values.</p>

    <div class="grid2">
      <div class="stack">
        <div class="label">Input</div>
        <label>X <input id="x" type="range" min="-50" max="100" value="10"></label>
        <label>Y <input id="y" type="range" min="-50" max="100" value="10"></label>
        <label>Blur <input id="blur" type="range" min="0" max="100" value="18"></label>
        <label>Spread <input id="spread" type="range" min="-50" max="50" value="0"></label>
        <label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.35"></label>
        <label>Color <input id="color" type="color" value="#1a1a1a"></label>
        <label><input id="inset" type="checkbox"> Inset</label>
        <div class="actions">
          <button id="process" type="button" class="btn">Process</button>
          <button id="copy" type="button" class="btn">Copy</button>
          <button id="export" type="button" class="btn">Export File</button>
          <button id="clear" type="button" class="btn">Clear</button>
        </div>
        <div id="status" class="status"></div>
        <div class="label">Output</div>
        <textarea id="out" aria-label="Output" readonly></textarea>
      </div>
      <div>
        <div id="box" class="preview" style="min-height:240px;display:grid;place-items:center">
          <div style="width:120px;height:120px;border:1px solid #1c1c1c;background:#d9d9d9"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/helpers.js"></script>
  <script src="script.js"></script>
</body>
</html>
