<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Previewer - ToolScart</title>
  <link rel="icon" href="/IMG_9203.JPG.ico" type="image/x-icon">
  <meta name="description" content="Markdown Previewer - Write markdown and preview it live.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar wrap">
    <a class="brand" href="/">ToolScart</a>
    <nav><a href="/">Tools</a></nav>
  </header>

  <main class="wrap page tool">
    <div class="crumb"><a href="/">Back to Tools</a><span>ToolScart</span></div>
    <h1>Markdown Previewer</h1>
    <p>Write markdown and preview it live.</p>

    <div class="stack">
      <div class="toolbar">
        <label class="btn file-label">Upload File<input class="file-input" id="file" type="file" accept=".md,.txt"></label>
        <button id="process" type="button" class="btn">Process</button>
        <button id="copy" type="button" class="btn">Copy</button>
        <button id="export" type="button" class="btn">Export File</button>
        <button id="clear" type="button" class="btn">Clear</button>
      </div>
      <div id="filemeta" class="file-meta"></div>
      <div class="label">Input</div>
      <textarea id="in" aria-label="Input"></textarea>
      <div class="label">Output</div>
      <div id="preview" class="preview"></div>
      <div id="status" class="status"></div>
    </div>
  </main>

  <script src="../../js/helpers.js"></script>
  <script src="script.js"></script>
</body>
</html>
