<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Gradient Generator - ToolScart</title>
  <link rel="icon" href="/IMG_9203.JPG.ico" type="image/x-icon">
  <meta name="description" content="CSS Gradient Generator - Create flat CSS gradients.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar wrap">
    <a class="brand" href="/">ToolScart</a>
    <nav><a href="/">Tools</a></nav>
  </header>

  <main class="wrap page tool">
    <div class="crumb"><a href="/">Back to Tools</a><span>ToolScart</span></div>
    <h1>CSS Gradient Generator</h1>
    <p>Create flat CSS gradients.</p>

    <div class="grid2">
      <div class="stack">
        <div class="label">Input</div>
        <label>Color 1 <input id="c1" type="color" value="#f2f2f2"></label>
        <label>Color 2 <input id="c2" type="color" value="#d7d7d7"></label>
        <label>Type <select id="type"><option value="linear">Linear</option><option value="radial">Radial</option></select></label>
        <label>Angle <input id="angle" type="number" value="45"></label>
        <div class="actions">
          <button id="process" type="button" class="btn">Process</button>
          <button id="copy" type="button" class="btn">Copy</button>
          <button id="export" type="button" class="btn">Export File</button>
          <button id="clear" type="button" class="btn">Clear</button>
        </div>
        <div id="status" class="status"></div>
        <div class="label">Output</div>
        <textarea id="out" aria-label="Output" readonly></textarea>
      </div>
      <div>
        <div class="preview" id="swatch" style="min-height:240px"></div>
      </div>
    </div>
  </main>

  <script src="../../js/helpers.js"></script>
  <script src="script.js"></script>
</body>
</html>
